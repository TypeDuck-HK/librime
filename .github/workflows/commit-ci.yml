name: Commit CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint:
    runs-on: macos-14
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
      - name: Install clang-format 18.1.8
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format-venv"
          "$RUNNER_TEMP/clang-format-venv/bin/python" -m pip install clang-format==18.1.8
          echo "$RUNNER_TEMP/clang-format-venv/bin" >> "$GITHUB_PATH"
      - name: Code style lint
        run: make clang-format-lint

  linux:
    needs: lint
    uses: ./.github/workflows/linux-build.yml

  macos:
    needs: lint
    uses: ./.github/workflows/macos-build.yml

  windows:
    needs: lint
    uses: ./.github/workflows/windows-build.yml

  docker:
    needs: lint
    uses: ./.github/workflows/docker-build.yml
